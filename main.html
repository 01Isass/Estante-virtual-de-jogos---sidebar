<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <title>Estante virtual de jogos</title>
</head>
<body>

    <div class="sidebar">
        <ul>

            <li class="active">
                <a href="#">
                    <span class="icone">
                        <i class="material-symbols-outlined">stadia_controller</i>
                    </span>
                    <span class="titulo">Jogando</span>
                </a>
            </li>

            <li>
                <a href="#">
                    <span class="icone">
                        <i class="material-symbols-outlined">timer_pause</i>
                    </span>
                    <span class="titulo">Em espera</span>
                </a>
            </li>

            <li>
                <a href="#">
                    <span class="icone">
                        <i class="material-symbols-outlined">trophy</i>
                    </span>
                    <span class="titulo">Zerados</span>
                </a>
            </li>

            <li>
                <a href="#">
                    <span class="icone">
                        <i class="material-symbols-outlined">shopping_bag</i>
                    </span>
                    <span class="titulo">Lista de desejos</span>
                </a>
            </li>

        </ul>
    </div>
    
    <div class="container-cards">

        <div class="card">
            <img class="img-card" src="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1245620/capsule_616x353.jpg?t=1784684281" alt="Elden Ring" style="width: 100%;">
            <div class="card-description">
                <h4><b>Elden Ring</b></h4>
                <p>Souls Like</p>
            </div>
        </div>

        <div class="card">
            <img class="img-card" src="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/12120/capsule_616x353.jpg?t=1634144450" alt="GTA San Andreas" style="width: 100%;">
            <div class="card-description">
                <h4><b>GTA: San Andreas</b></h4>
                <p>Ação-Aventura</p>
            </div>
        </div>

        <div class="card">
            <img class="img-card" src="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/292030/96b8627588997030e5a6b56ca5e9944756c8f288/capsule_616x353.jpg?t=1768303991" alt="The Witcher 3" style="width: 100%;">
            <div class="card-description">
                <h4><b>The Witcher 3: Wild Hunt</b></h4>
                <p>RPG de Ação</p>
            </div>
        </div>

        <div class="card">
            <img class="img-card" src="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1030300/7983574d464e6559ac7e24275727f73a8bcca1f3/header.jpg?t=1776125736" alt="Hollow Knight Silksong" style="width: 100%;">
            <div class="card-description">
                <h4><b>Hollow Knight Silksong</b></h4>
                <p>Ação</p>
            </div>
        </div>

        <div class="card">
            <img class="img-card" src="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1458140/2760a8bda00bf838d5295e9c7e2ad9f64d106e23/capsule_616x353.jpg?t=1763777212" alt="Pacific Drive" style="width: 100%;">
            <div class="card-description">
                <h4><b>Pacific Drive</b></h4>
                <p>Aventura Indie</p>
            </div>
        </div>

        
    </div>
    
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
</body>
</html>
